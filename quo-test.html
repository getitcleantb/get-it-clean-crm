<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quo picture test</title>
<meta name="robots" content="noindex">
<style>
body{font:17px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#f6f7f9;color:#111}
h1{font-size:20px;margin:0 0 8px}p{margin:6px 0 14px}
a.b,button.b{display:block;width:100%;box-sizing:border-box;text-align:left;padding:14px;margin:0 0 12px;border-radius:10px;border:1px solid #c9ced6;background:#fff;color:#111;text-decoration:none;font:inherit}
a.b b,button.b b{display:block;font-size:18px;margin-bottom:2px}small{color:#555}
</style></head><body>
<h1>Quo picture test</h1>
<p>Tap each one. Quo opens. Look at whether the picture is on the message, then back out without sending. Tell Claude which numbers had the picture.</p>
<div id="list"></div>
<script>
const num = (new URLSearchParams(location.hash.slice(1)).get("n") || "").replace(/\D/g, "");
const to = num ? "+1" + num.slice(-10) : "";
const from = "+17272708945";
const jpg = "https://get-it-clean-tb-crm-5025b.web.app/i/20261106-82ac03d0aceb3c3bd7ef5864cf254e57.jpg";
const png = new URL("icons/icon-192.png", location.href).href;
const e = encodeURIComponent, text = e("Picture test, don't send");
const v = [
  ["1", "Like the CRM does it now", `openphone://message?number=${e(to)}&from=${e(from)}&text=${text}&attachments=${e(jpg)}`],
  ["2", "Picture address not encoded", `openphone://message?number=${e(to)}&from=${e(from)}&text=${text}&attachments=${jpg}`],
  ["3", "Picture only, no message", `openphone://message?number=${e(to)}&attachments=${e(jpg)}`],
  ["4", "A different picture (the CRM's icon)", `openphone://message?number=${e(to)}&text=${text}&attachments=${e(png)}`],
  ["5", "No number, picture and message", `openphone://message?text=${text}&attachments=${e(jpg)}`],
];
const list = document.getElementById("list");
v.forEach(([n, label, href]) => { const a = document.createElement("a"); a.className = "b"; a.href = href; a.innerHTML = `<b>${n}. ${label}</b><small>Opens Quo</small>`; list.appendChild(a); });
const s = document.createElement("button"); s.className = "b"; s.innerHTML = "<b>6. Share sheet</b><small>Is Quo in the list of apps? Don't send.</small>";
s.onclick = async () => {
  try { const blob = await (await fetch(png)).blob(); const f = new File([blob], "test.png", { type: "image/png" }); await navigator.share({ files: [f], text: "Picture test, don't send" }); }
  catch (er) { if (!er || er.name !== "AbortError") alert("The share sheet didn't open on this phone."); }
};
list.appendChild(s);
</script>
</body></html>
