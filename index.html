<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: navy sidebar on desktop, bottom tab bar on phone. Each page is one calm column: page title, a joined number strip, then panels with plenty of air. */
:root {
  --gold: #f2c230; --gold-ink: #3b2b00; --gold-dot: #b8860b;
  --bg: #f3f6f9;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --wash: #e9eef5;
  --ink: #0d1b33;
  --ink-2: #44526b;
  --muted: #66748c;
  --line: #dde4ee;
  --navy: #0a1f5c;
  --accent: #1d43d8;
  --accent-soft: #e5ebff;
  --sky: #14a8ee;
  --rev: #2a78d6;
  --exp: #eb6834;
  --good: #0b7a43;
  --good-soft: #dcf3e6;
  --warn: #9a5b00;
  --warn-soft: #fcefd6;
  --bad: #c2362f;
  --bad-soft: #fbe2df;
  --plum: #6d35b0;
  --plum-soft: #efe5fb;
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --gold: #e6b734; --gold-ink: #1f1600; --gold-dot: #f2c230;
  --bg: #0b1320; --surface: #131e2d; --surface-2: #0f1826; --wash: #1b2a3c; --ink: #edf2f8; --ink-2: #c0cbda; --muted: #92a0b5; --line: #253447;
  --navy: #0b1d52; --accent: #7f99ff; --accent-soft: #1d2a5c; --sky: #3fc2ff; --rev: #3987e5; --exp: #e0652f;
  --good: #4cc38a; --good-soft: #10301f; --warn: #e5aa45; --warn-soft: #33260c; --bad: #f08079; --bad-soft: #3a1513; --plum: #c9a2f5; --plum-soft: #2b1c42; color-scheme: dark; } }
:root[data-theme="dark"] {
  --gold: #e6b734; --gold-ink: #1f1600; --gold-dot: #f2c230;
  --bg: #0b1320; --surface: #131e2d; --surface-2: #0f1826; --wash: #1b2a3c; --ink: #edf2f8; --ink-2: #c0cbda; --muted: #92a0b5; --line: #253447;
  --navy: #0b1d52; --accent: #7f99ff; --accent-soft: #1d2a5c; --sky: #3fc2ff; --rev: #3987e5; --exp: #e0652f;
  --good: #4cc38a; --good-soft: #10301f; --warn: #e5aa45; --warn-soft: #33260c; --bad: #f08079; --bad-soft: #3a1513; --plum: #c9a2f5; --plum-soft: #2b1c42; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

/* shell */
.app { display: grid; grid-template-columns: 224px 1fr; min-height: 100%; }
.side { background: var(--navy); color: #fff; padding: 20px 12px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 2px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; flex-direction: column; gap: 8px; padding: 2px 8px 22px; }
.brand img { width: 150px; background: #fff; border-radius: 10px; padding: 6px 8px; }
.brand span { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; color: inherit; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; text-align: left; opacity: .78; }
.nav-btn svg { width: 19px; height: 19px; flex: none; }
.nav-btn:hover { background: rgba(255,255,255,.08); opacity: 1; }
.nav-btn[aria-current="page"] { background: rgba(255,255,255,.15); opacity: 1; }
.nav-btn .count { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 0 8px; }
.side .spacer { flex: 1; }
.side .foot { font-size: 12px; opacity: .62; padding: 8px 12px; line-height: 1.4; }

.main { min-width: 0; padding-block: 30px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.wrap > * { min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.1; letter-spacing: -.02em; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mobile-head { display: none; }
.tabbar { display: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0a1030; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0a1030; } }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.big { padding: 12px 16px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 17px; height: 17px; flex: none; }
.icon-btn { width: 36px; height: 36px; padding: 0; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel.flush { padding: 0; gap: 0; overflow: hidden; }
.panel.flush > .panel-h { padding: 18px 20px 12px; }
.panel.flush > .note, .panel.flush > .pad { padding: 0 20px 18px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-h h2 { font-size: 19px; }
.panel-h .count { font-size: 13px; color: var(--muted); font-weight: 600; }
.panel .empty, .empty { padding: 26px 20px; color: var(--muted); text-align: center; }
.note { color: var(--muted); font-size: 13px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.today-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.col-stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

/* number strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 16px 20px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kpi .lab { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .val { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 13px; color: var(--ink-2); }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* lists */
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 14px; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid var(--line); cursor: pointer; min-width: 0; background: none; text-align: left; width: 100%; color: inherit; }
.list > .item:first-child { border-top: 0; }
.panel.flush > .list > .item:first-child { border-top: 1px solid var(--line); }
.panel.flush > .list:first-child > .item:first-child, .panel.flush > .list:first-child > .grp-toggle:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item.static { cursor: default; }
.item.static:hover { background: none; }
.item .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.bankpct { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: default; }
.bankpct input[type=number] { width: 70px; padding: 6px 8px; border-radius: 8px; }
.bankpct .num { color: var(--ink-2); }
.grp-toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 20px; border: 0; border-top: 1px solid var(--line); background: var(--surface-2); color: inherit; text-align: left; cursor: pointer; font: inherit; }
.list > .grp-toggle:first-child { border-top: 0; }
.grp-toggle:hover { background: var(--hover, var(--line)); }
.grp-toggle .chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: 2px; }
.grp-toggle[aria-expanded="true"] .chev { transform: rotate(45deg); }
.grp-toggle .gname { font-weight: 700; flex: none; }
.grp-toggle .gsum { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
.group-h { padding: 9px 20px; background: var(--surface-2); border-top: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.sub-h { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 20px 6px; border-top: 1px solid var(--line); }
.list > .sub-h:first-child { border-top: 0; padding-top: 4px; }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.s-new { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.s-working, .pill.s-visit, .pill.s-quoted { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.s-selling { background: var(--plum-soft); color: var(--plum); border-color: transparent; }
.pill.s-scheduled, .pill.s-completed { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.s-paid { background: var(--good); color: #fff; border-color: transparent; }
.pill.s-lost { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.dnc { background: var(--bad); color: #fff; border-color: transparent; }
.pill.due { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.over { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.out { background: var(--wash); color: var(--ink-2); border-color: transparent; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* forms */
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.controls input[type=search] { flex: 1 1 220px; min-width: 0; }
input[type=text], input[type=search], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=time], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; width: 100%; }
.controls select, .controls input[type=date] { width: auto; }
select.show { font-weight: 700; font-size: 15px; padding: 10px 14px; border-color: var(--ink-2); max-width: 100%; }
textarea { resize: vertical; min-height: 70px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
label.f[hidden] { display: none; }
/* email blasts */
.bl-list { max-height: 460px; overflow-y: auto; border-top: 1px solid var(--line); }
.bl-grp .grp-toggle { cursor: default; padding: 10px 20px; }
.bl-grp .grp-toggle label.check { flex: 1; min-width: 0; }
.bl-row { padding: 9px 20px 9px 28px; border-top: 1px solid var(--line); min-height: 44px; cursor: pointer; }
.bl-row input { flex: none; width: 20px; height: 20px; }
.bl-row .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bl-row .t { font-weight: 600; } .bl-row .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.bl-row.off { opacity: .6; cursor: default; }
.bl-mail { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.bl-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; }
.bl-log { margin: 4px 0 8px 18px; display: grid; gap: 2px; }
#bl-prev-pick select { max-width: 220px; }
label.check { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; color: var(--ink); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form .full { grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 600 13px var(--f-body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.chips button:hover { border-color: var(--muted); color: var(--ink); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.svc-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.svc-pick label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; background: var(--surface); }

/* pipeline board */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(140px, 1fr); gap: 12px; min-width: min-content; }
.bcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 200px; }
.bcol.drop { outline: 2px dashed var(--sky); }
.bcol > h3 { font-size: 15px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
.bcol > h3 small { font-family: var(--f-body); font-weight: 600; color: var(--muted); }
.cards { display: flex; flex-direction: column; gap: 8px; padding: 10px; max-height: 70vh; overflow-y: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: grab; display: flex; flex-direction: column; gap: 4px; text-align: left; color: inherit; width: 100%; }
.card .t { font-weight: 600; font-size: 14px; }
.card .s { font-size: 12.5px; color: var(--muted); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(5,12,35,.55); z-index: 60; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--bg); border-radius: 18px; width: 100%; max-width: 820px; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.sheet.wide { max-width: 1240px; }
.sheet > .sh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; background: var(--navy); color: #fff; border-radius: 18px 18px 0 0; }
.sheet > .sh h2 { font-size: 21px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet > .sh .x { background: rgba(255,255,255,.14); border: 0; color: #fff; border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 22px; flex: none; }
.sheet > .sb { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.ltabs { display: flex; gap: 4px; padding: 10px 20px 0; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ltabs button { border: 0; background: none; padding: 10px 12px 11px; font-weight: 600; font-size: 14.5px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.ltabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.ltabs button .n { font-size: 12px; color: var(--muted); margin-left: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.next-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
/* the lead page */
.sheet > .sh .sh-t { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sheet > .sh .sh-t h2 { min-width: 0; }
.lead-card { gap: 18px; }
.lc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; }
.lc-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 260px; }
.lc-name { font-size: clamp(24px, 3.4vw, 30px); line-height: 1.1; letter-spacing: -.02em; margin-top: 4px; overflow-wrap: anywhere; }
.lc-val { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.2; color: var(--ink-2); }
.lc-val .muted { font-family: var(--f-body); font-weight: 500; font-size: 14px; }
.lc-acts { flex: none; }
.lc-sec { display: flex; flex-direction: column; gap: 8px; }
.lab { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stage-row { display: flex; flex-wrap: wrap; gap: 6px; }
.stage-row .stg { font: 600 13px var(--f-body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; cursor: pointer; min-height: 36px; }
.stage-row .stg:hover { border-color: var(--muted); color: var(--ink); }
.stage-row .stg[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
:root[data-theme="dark"] .stage-row .stg[aria-pressed="true"] { color: #0a1030; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage-row .stg[aria-pressed="true"] { color: #0a1030; } }
.dispo-row { gap: 8px 14px; }
.dispo-row select.show { width: auto; max-width: 100%; flex: 0 1 360px; }
.info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.ic { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ic .k { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.ic .v { font-weight: 600; overflow-wrap: anywhere; }
.ic .v a { color: inherit; text-decoration: none; }
.ic .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.ic input[type=date] { width: auto; max-width: 100%; padding: 6px 10px; font-weight: 600; }

/* month view */
.mnav { gap: 6px; justify-content: flex-start; }
.mnav h2 { min-width: 168px; text-align: center; }
.mnav .btn.ghost { margin-left: 4px; }
.mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mcal .wd { background: var(--surface-2); text-align: center; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 7px 0; }
.mday { background: var(--surface); border: 0; min-height: 96px; padding: 6px; display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer; color: inherit; min-width: 0; font: inherit; }
.mday:hover { background: var(--surface-2); }
.mday.dim { background: var(--surface-2); color: var(--muted); }
.mday .dn { font-size: 13px; font-weight: 600; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
.mday.today .dn { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .mday.today .dn { color: #0a1030; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mday.today .dn { color: #0a1030; } }
.mday.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.mday .mevs { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
/* every event on the month calendar is gold, so it stands out */
.mev { font-size: 11.5px; line-height: 1.3; padding: 2px 6px; border-radius: 5px; background: var(--gold); color: var(--gold-ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mday .more { font-size: 11px; color: var(--muted); padding-left: 2px; }
.mcal.compact .mday { min-height: 70px; }
.bk-times .btn { min-height: 38px; min-width: 84px; justify-content: center; }
.mdots { display: none; }

.logged { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 11px 14px; border-radius: 12px; background: var(--good-soft); color: var(--good); font-weight: 600; font-size: 14px; }

.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tl:first-child { border-top: 0; }
.tl .when { color: var(--muted); font-size: 13px; }
.banner { padding: 11px 14px; border-radius: 12px; font-size: 14px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.banner.info { background: var(--accent-soft); color: var(--accent); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.msgrow { display: flex; flex-direction: column; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
.list > .msgrow:first-child { border-top: 0; }
.msgrow .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.msgrow .who { font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-align: left; font-size: 15px; }
.msgrow .what { font-size: 13px; color: var(--muted); }
.msg { white-space: pre-wrap; font-size: 14px; color: var(--ink-2); }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.tpl { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }

/* quote editor */
.qgrid { display: grid; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.items { display: flex; flex-direction: column; gap: 8px; }
.qitem { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qitem .full { grid-column: 1 / -1; }
.qitem .mini { display: grid; grid-template-columns: 1fr 1fr 70px auto; gap: 8px; align-items: end; grid-column: 1 / -1; }
.qitem label.f { font-size: 12px; }
.qtotal { display: flex; justify-content: space-between; font-family: var(--f-display); font-weight: 700; font-size: 24px; padding: 6px 2px; }
.preview-box { position: sticky; top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.qitem [data-minnote]:empty { display: none; }
.qitem [data-minnote] { grid-column: 1 / -1; color: var(--warn); font-weight: 600; }
.qsec { display: flex; flex-direction: column; gap: 8px; }
.qsec > .lab { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
details.qmore summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14px; padding: 4px 0; width: max-content; }
details.qmore[open] summary { margin-bottom: 8px; }
.qfoot { position: sticky; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 14px; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
.qfoot .qtotal { flex: 1; padding: 0; gap: 12px; }
#q-pill:empty, #del-confirm:empty { display: none; }
.preview-scale { overflow: hidden; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.15); background: #fff; }
.preview-scale > .est { transform-origin: 0 0; }

/* money */
.plot { position: relative; height: 220px; margin-left: 48px; }
.gridl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.gridl span { position: absolute; left: -48px; top: -9px; width: 42px; text-align: right; font-size: 12px; color: var(--muted); }
.cols { position: absolute; inset: 0; display: flex; }
.mcol { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3px; background: transparent; border: 0; padding: 0 4px; cursor: pointer; border-radius: 8px 8px 0 0; min-width: 0; }
.mcol:hover, .mcol.sel { background: var(--wash); }
.bar { width: min(36px, 38%); border-radius: 4px 4px 0 0; min-height: 1px; }
.xl { display: flex; margin-left: 48px; }
.xl div { flex: 1; text-align: center; font-size: 13px; min-width: 0; }
.xl b { display: block; font-weight: 600; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.hb { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 9px 12px; align-items: center; }
.hb .track { height: 14px; }
.hb .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.hb .n { color: var(--ink-2); overflow-wrap: anywhere; }
.take { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.take div { border-top: 2px solid var(--ink); padding-top: 10px; }
.take b { display: block; font-family: var(--f-display); font-size: 17px; line-height: 1.25; margin-bottom: 4px; }
.take p { color: var(--ink-2); font-size: 14px; }
.mini-bar { height: 6px; background: var(--rev); border-radius: 0 3px 3px 0; margin-top: 4px; min-width: 2px; }
.flag { display: inline-block; background: var(--warn-soft); color: var(--warn); font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }

.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 700; }
table.t th[data-sort] { cursor: pointer; user-select: none; }
table.t th[data-sort]:hover { color: var(--ink); }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr[data-open-lead] { cursor: pointer; }
table.t tr[data-open-lead]:hover td { background: var(--surface-2); }
table.t td:first-child, table.t th:first-child { padding-left: 20px; }
table.t td:last-child, table.t th:last-child { padding-right: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 10px; font-weight: 600; z-index: 90; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; }
.toast-btn { border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer; flex: none; }
.only-narrow { display: none !important; }
.sub-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -10px; }
.total-row .t { font-weight: 700; }
.grp-toggle.static { cursor: default; }
.bcol.drop-only { min-height: 110px; }
.bdrops { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bdrops > .note { padding: 0 4px; }
.bcol.drop-only .note { padding: 14px; }
.muted { color: var(--muted); }
details.menu { position: relative; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu > summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-2px); margin-left: 2px; }
.menu-box { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.menu-box .btn { justify-content: flex-start; }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 18px 20px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { font-size: 19px; }
details.fold > summary .more::after { content: "Show all"; font-weight: 600; font-size: 14px; color: var(--accent); }
details.fold[open] > summary .more::after { content: "Hide"; }
details.fold[open] > summary { padding-bottom: 12px; }
details.mprev > summary { list-style: none; cursor: pointer; }
details.mprev > summary::-webkit-details-marker { display: none; }
details.mprev[open] > summary.clamp { display: block; -webkit-line-clamp: unset; white-space: pre-wrap; }
details.more-tpl > summary { cursor: pointer; padding: 14px 20px; border-top: 1px solid var(--line); font-weight: 600; color: var(--accent); }
.cnotes { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; margin-top: 2px; border-top: 1px solid var(--line); }
.cnotes .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.cnotes .clamp { white-space: pre-wrap; }
.cnotes .btn { align-self: flex-start; padding-left: 0; }
div.item[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#pb [data-pk="name"] { min-width: 170px; }
#pb [data-pk="rate"], #pb [data-pk="min"] { width: 96px; }
.small { font-size: 13px; }
.offscreen { position: fixed; left: -12000px; top: 0; }

/* Email > Inbox: the list on the left, the open conversation on the right (one at a time on a phone) */
.ib { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
.ib-ctl { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 12px; }
.ib-search { flex-wrap: nowrap; }
.ib-search input { flex: 1 1 auto; min-width: 0; }
.ib-ctl .seg button { padding-inline: 10px; font-size: 13.5px; }
.ib-row.sel { background: var(--accent-soft); }
.ib-row .ib-subj { color: var(--ink-2); font-weight: 500; }
.ib-foot { padding: 12px 16px 16px; gap: 10px; }
.ib-conv { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.ib-head { padding: 16px 20px 10px; flex-wrap: nowrap; align-items: flex-start; }
.ib-head h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 18px; }
.ib-head .btn { flex: none; }
.ib-back { display: none; }
.panel.flush > .ib-top { display: flex; flex-direction: column; gap: 10px; padding: 0 20px 16px; }
.ib-people { display: flex; flex-wrap: wrap; gap: 8px; }
.ib-who { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: inherit; text-align: left; cursor: pointer; font-size: 14px; max-width: 100%; overflow-wrap: anywhere; }
.ib-who.static { cursor: default; }
button.ib-who:hover { background: var(--surface-2); }
.ib-res select { width: auto; max-width: 100%; }
.ib-res select.show { flex: 0 1 380px; }
.ib-logged { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.ib-msgs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ib-msg { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ib-msg.mine { background: var(--surface-2); }
.ib-mh { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
.ib-from, .ib-to { min-width: 0; overflow-wrap: anywhere; }
.ib-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.5; }
.ib-q > summary, .ib-older > summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
.ib-q .ib-body { color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin-top: 6px; }
.ib-older > summary { padding: 10px 20px; border-bottom: 1px solid var(--line); }
.ib-reply { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.ib-reply textarea { width: 100%; min-height: 160px; }
.tabbar button { position: relative; }
.tb-n { position: absolute; top: 3px; left: calc(50% + 5px); background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 0 5px; line-height: 16px; min-width: 16px; text-align: center; }
@media (max-width: 900px) {
  .ib { grid-template-columns: minmax(0, 1fr); }
  .ib.has-sel .ib-list, .ib:not(.has-sel) .ib-conv { display: none; }
  .ib-conv { position: static; max-height: none; overflow: visible; }
  .ib-back { display: inline-flex; flex: none; }
  .ib-head { flex-wrap: wrap; }
}
@media (max-width: 640px) { .ib-msg { padding: 12px 16px; } .ib-head { padding: 14px 16px 8px; } .panel.flush > .ib-top { padding: 0 16px 14px; } .ib-reply { padding: 14px 16px 18px; } .ib-older > summary { padding: 10px 16px; } .ib-res select.show { flex: 1 1 100%; } }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } .qgrid { grid-template-columns: minmax(0, 1fr); } .preview-box { position: static; } .today-grid { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding-block: 0 calc(90px + env(safe-area-inset-bottom, 0px)); }
  .wrap { gap: 20px; }
  .mobile-head { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--navy); color: #fff; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); margin-bottom: 18px; }
  .mobile-head img { height: 34px; background: #fff; border-radius: 6px; padding: 2px 5px; }
  .mobile-head .btn { background: rgba(255,255,255,.14); color: #fff; border-color: transparent; }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .two { grid-template-columns: 1fr; }
  .form { grid-template-columns: 1fr; }
  .scrim { padding: 0; }
  .sheet { border-radius: 0; min-height: 100%; }
  .sheet > .sh { border-radius: 0; position: sticky; top: 0; z-index: 2; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
  .sheet > .sh .sh-t .pill { display: none; }
  .sheet > .sb { padding: 16px; }
  .ltabs { padding-left: 16px; padding-right: 16px; }
  .panel { padding: 16px; }
  .panel.flush > .panel-h { padding: 16px 16px 10px; }
  .panel.flush > .note, .panel.flush > .pad { padding: 0 16px 16px; }
  .item, .msgrow { padding-left: 16px; padding-right: 16px; }
  .group-h, .sub-h { padding-left: 16px; padding-right: 16px; }
  table.t td:first-child, table.t th:first-child { padding-left: 16px; }
  table.t td:last-child, table.t th:last-child { padding-right: 16px; }
  .hide-mob { display: none !important; }
  /* big enough to tap */
  .msgrow .btn.sm, .item .btn.sm, .ic .btn.sm, .mobile-head .btn.sm, #modal .actions .btn, #modal .item .btn.sm, .qitem .btn.sm, .logged .btn.sm, .lc-acts .btn, .mnav .btn { min-height: 42px; }
  .chips button { min-height: 36px; }
  .item .r .row { gap: 10px; }
}
@media (max-width: 640px) {
  .bl-row { padding-left: 16px; padding-right: 12px; } .bl-grp .grp-toggle { padding: 10px 12px; } .bl-list { max-height: none; } #bl-prev-pick select { max-width: 150px; }
  .only-wide { display: none !important; }
  .only-narrow { display: flex !important; }
  .item.flow { flex-wrap: wrap; row-gap: 6px; }
  .item.flow .main-col { flex-basis: 100%; }
  .item.flow .r { flex-direction: row; align-items: center; flex-wrap: wrap; flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .item.flow .pill { white-space: normal; max-width: 100%; }
  .page-head .menu-box { left: 0; right: auto; }
  .item.flow .t { white-space: normal; }
  .page-head > * { min-width: 0; max-width: 100%; }
  .page-head > .row:has(.seg) { width: 100%; }
  .page-head .seg, .seg.wide { display: flex; width: 100%; }
  .page-head .seg button, .seg.wide button { flex: 1 1 auto; padding: 8px 8px; font-size: 13.5px; }
  .ltabs { gap: 0; padding-left: 6px; padding-right: 6px; }
  .ltabs button { padding: 10px 6px 11px; font-size: 13.5px; }
  .ltabs button .n { margin-left: 2px; }
  .grp-toggle { flex-wrap: wrap; row-gap: 2px; padding: 13px 16px; }
  .grp-toggle .gsum { margin-left: 22px; flex-basis: 100%; text-align: left; }
  .next-steps { grid-template-columns: 1fr; }
  .info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 14px; }
  .ic.wide { grid-column: 1 / -1; }
  .lc-acts { width: 100%; }
  .lc-acts .btn { flex: 1 1 auto; }
  .dispo-row select.show { flex: 1 1 100%; }
  .mday { min-height: 56px; padding: 4px 2px; align-items: center; gap: 4px; }
  .mday .dn { width: 24px; height: 24px; font-size: 12.5px; }
  .mday .mevs, .mday .more { display: none; }
  .mcal.compact .mday { min-height: 48px; }
  .mdots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .mdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-dot); }
  .mnav h2 { min-width: 0; flex: 1; font-size: 17px; }
  .controls select.show { flex: 1 1 100%; }
  .controls input[type=search] { flex-basis: 140px; }
  .hb { grid-template-columns: minmax(80px, 110px) 1fr auto; }
  .tl { grid-template-columns: 1fr; gap: 2px; }
  /* price book: one small card per service */
  #pb, #pb tbody { display: block; }
  #pb thead { display: none; }
  #pb tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "name name del" "unit rate min"; gap: 8px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #pb td { display: block; padding: 0; border: 0; text-align: left; }
  #pb td:nth-child(1) { grid-area: name; } #pb td:nth-child(2) { grid-area: unit; } #pb td:nth-child(3) { grid-area: rate; } #pb td:nth-child(4) { grid-area: min; }
  #pb td:nth-child(5) { grid-area: del; display: flex; justify-content: flex-end; align-items: flex-start; }
  #pb td:nth-child(n+2):nth-child(-n+4)::before { content: attr(data-l); display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  #pb [data-pk] { width: 100%; min-width: 0; }
}
@media (max-width: 420px) { .kpi { padding: 14px 16px; } .qitem .mini { grid-template-columns: 1fr 1fr; } .plot, .xl { margin-left: 40px; } .gridl span { left: -40px; width: 36px; } }

<script>
// Google Calendar and Gmail for the standalone CRM. Google is asked for access in this same window (no popups, so it
// works as a home-screen app on a phone), the short-lived token is kept on this device, and the events from three
// months back to a year ahead are read straight from Google's Calendar API and kept here so the CRM opens with them.
// Gmail uses the same sign-in: drafts and emails go out from the connected account, and a lead's recent emails are read.
// The CRM reads this through window.GICCAL / window.GICMAIL and hears about changes on the "gic-gcal" event.
(() => {
  "use strict";
  const CFG = window.GIC_CONFIG || {};
  const CLIENT = String(CFG.googleClientId || "").trim();
  const SCOPES = ["https://www.googleapis.com/auth/calendar.events", "https://www.googleapis.com/auth/calendar.readonly", "https://www.googleapis.com/auth/gmail.compose", "https://www.googleapis.com/auth/gmail.readonly"];
  const API = String(CFG.googleApi || "https://www.googleapis.com/calendar/v3").replace(/\/$/, "");
  const GMAIL = String(CFG.gmailApi || "https://gmail.googleapis.com/gmail/v1").replace(/\/$/, "");
  const AUTH_URL = CFG.googleAuth || "https://accounts.google.com/o/oauth2/v2/auth";
  const PAST_MONTHS = 3, AHEAD_DAYS = 365, REFRESH_MS = 5 * 60 * 1000, AUTO_GAP_MS = 2 * 60 * 1000;
  const K = { tok: "gic-gcal-token", ev: "gic-gcal-events", on: "gic-gcal-on", nonce: "gic-gcal-nonce", ret: "gic-gcal-return", auto: "gic-gcal-auto", quiet: "gic-gcal-quiet", hint: "gic-gcal-hint", acct: "gic-gcal-acct", scope: "gic-gcal-scope" };
  const store = (s) => ({
    get: (k) => { try { const v = s.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
    set: (k, v) => { try { s.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: (k) => { try { s.removeItem(k); } catch (e) {} }
  });
  const L = store(localStorage), SS = store(sessionStorage);
  const fire = () => { try { window.dispatchEvent(new CustomEvent("gic-gcal")); } catch (e) {} };

  let status = CLIENT ? "idle" : "off"; // off (not set up) · idle (not connected) · loading · ready · expired (needs a tap) · error
  let msg = "", token = null, cache = L.get(K.ev) || { at: 0, cals: [], events: [] }, loading = null, returned = null;
  if (!Array.isArray(cache.events)) cache = { at: 0, cals: [], events: [] };
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const range = () => { const a = new Date(); a.setMonth(a.getMonth() - PAST_MONTHS); a.setHours(0, 0, 0, 0); const b = new Date(); b.setDate(b.getDate() + AHEAD_DAYS); b.setHours(23, 59, 59, 0); return { from: ymd(a), to: ymd(b), min: a.toISOString(), max: b.toISOString() }; };
  const tokenOk = () => !!(token && token.t && token.exp > Date.now());
  // what Google allowed: the consent screen has a box for each of the four, and any can be unticked. A wider access
  // given to this CRM before (all of Calendar, all of Gmail) counts too. An old token without a list had them all.
  const NEEDS = { calRead: ["calendar.readonly", "calendar"], calWrite: ["calendar.events", "calendar"], mailSend: ["gmail.compose", "gmail.modify", "https://mail.google.com/"], mailRead: ["gmail.readonly", "gmail.modify", "https://mail.google.com/"] };

  const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
  const nonce = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");

  // ---------- signing in: a trip to Google and back in this window ----------
  // hint = the email the CRM is signed in with, so Google picks that account (the business one) when several are signed in
  function goToGoogle(silent, ret, hint) {
    const n = nonce() + (silent ? ".q" : ".u");
    L.set(K.nonce, n); SS.set(K.nonce, n);
    if (ret) { SS.set(K.ret, ret); L.set(K.ret, ret); } else { SS.del(K.ret); L.del(K.ret); }
    if (silent) L.set(K.auto, Date.now());
    hint = String(hint || L.get(K.hint) || "").trim(); if (hint) L.set(K.hint, hint);

    if (silent) q.set("prompt", "none");
    location.replace(AUTH_URL + "?" + q.toString());
  }
  // Google sends the token (or an error) back in the part of the address after #
  function takeFromAddress() {
    const h = location.hash || ""; if (!/(^|[#&])(access_token|error)=/.test(h)) return false;
    const p = new URLSearchParams(h.slice(1));
    const want = SS.get(K.nonce) || L.get(K.nonce); const st = p.get("state") || "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    SS.del(K.nonce); L.del(K.nonce);
    const silent = /\.q$/.test(st);
    returned = SS.get(K.ret) || L.get(K.ret) || null; SS.del(K.ret); L.del(K.ret);
    if (!want || st !== want) { returned = null; msg = "Couldn't finish connecting Google Calendar. Try again."; status = L.get(K.on) ? "expired" : "idle"; return true; }
    const err = p.get("error");
    if (err || !p.get("access_token")) {
      if (silent) { L.set(K.quiet, 1); status = "expired"; msg = "Google Calendar needs a quick reconnect."; }
      else { status = L.get(K.on) ? "expired" : "idle"; msg = err === "access_denied" ? "You didn't allow calendar access, so Google Calendar isn't connected." : "Couldn't connect Google Calendar. Try again."; }

    token = { t: p.get("access_token"), exp: Date.now() + (Math.max(60, +p.get("expires_in") || 3600) - 60) * 1000, scope: scope || null };
    L.set(K.tok, token); L.set(K.on, 1); L.set(K.scope, scope || null); L.del(K.quiet); msg = ""; status = "loading";
    if (scope && !inList(scope, "calRead")) msg = "You didn't allow calendar access. Tap Reconnect and tick the calendar boxes to show it here.";
    return true;
  }

  // ---------- Google's Calendar API ----------
  async function call(path, opts, base) {
    if (!tokenOk()) { const e = new Error("expired"); e.code = "expired"; throw e; }
    let r;
    try { r = await fetch((base || API) + path, Object.assign({ headers: { Authorization: "Bearer " + token.t, "Content-Type": "application/json" } }, opts || {})); }
    catch (e) { const x = new Error("offline"); x.code = "offline"; throw x; }
    if (r.status === 401) { token = null; L.del(K.tok); if (status !== "idle") { status = "expired"; msg = "Google needs a quick reconnect."; } fire(); const e = new Error("expired"); e.code = "expired"; throw e; }
    if (!r.ok) { let d = ""; try { d = (await r.json()).error.message; } catch (e) {} const x = new Error(d || ("Google said " + r.status)); x.code = r.status === 403 ? "forbidden" : r.status === 404 || r.status === 410 ? "gone" : "http"; x.status = r.status; throw x; }
    if (r.status === 204) return {};
    return r.json();
  }
  const trim = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  const tz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York"; } catch (e) { return "America/New_York"; } };

  // ---------- Gmail ----------
  const utf8b64 = (str) => { const by = new TextEncoder().encode(String(str || "")); let bin = ""; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
  const lines76 = (b) => String(b || "").replace(/\s+/g, "").replace(/.{76}(?=.)/g, "$&\r\n");
  const head = (s) => /^[\x20-\x7e]*$/.test(s) ? s : "=?UTF-8?B?" + utf8b64(s) + "?=";
  const safeName = (s) => String(s || "file").replace(/[\r\n"\\]/g, "").slice(0, 120) || "file";
  // the email as Gmail wants it: MIME text, base64url; attachments are { filename, mimeType, content (base64) }.
  // A reply also has cc, inReplyTo and references, so it lands in the same conversation for them too.
  const one = (s) => String(s || "").replace(/[\r\n]+/g, " ").trim();
  function mime(m) {
    const top = ["To: " + String(m.to || "").replace(/[\r\n]/g, ""), m.cc ? "Cc: " + one(m.cc) : "", "Subject: " + head(String(m.subject || "").replace(/[\r\n]+/g, " ")),
      m.inReplyTo ? "In-Reply-To: " + one(m.inReplyTo) : "", m.references ? "References: " + one(m.references) : "", "MIME-Version: 1.0"].filter(Boolean);
    const text = ["Content-Type: text/plain; charset=UTF-8", "Content-Transfer-Encoding: base64", "", lines76(utf8b64(String(m.body || "").replace(/\r?\n/g, "\r\n")))].join("\r\n");
    const att = (m.attachments || []).filter(a => a && typeof a.content === "string");
    let out;
    if (!att.length) out = top.concat([text]).join("\r\n");
    else {
      const bd = "gic_" + nonce();
      const parts = [text].concat(att.map(a => [`Content-Type: ${String(a.mimeType || "application/octet-stream").replace(/[\r\n;]/g, "")}; name="${safeName(a.filename)}"`, `Content-Disposition: attachment; filename="${safeName(a.filename)}"`, "Content-Transfer-Encoding: base64", "", lines76(a.content)].join("\r\n")));
      out = top.concat([`Content-Type: multipart/mixed; boundary="${bd}"`, "", parts.map(x => "--" + bd + "\r\n" + x).join("\r\n"), "--" + bd + "--", ""]).join("\r\n");
    }
    return btoa(out).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  const gmailLink = (hash) => "https://mail.google.com/mail/" + (L.get(K.acct) ? "?authuser=" + encodeURIComponent(L.get(K.acct)) : "") + "#" + hash;
  async function account() {
    if (L.get(K.acct)) return L.get(K.acct);
    try { const r = await call("/users/me/profile?fields=emailAddress", null, GMAIL); if (r.emailAddress) { L.set(K.acct, r.emailAddress); fire(); } } catch (e) {}

  }
  // Google's names for the two Gmail boxes on its consent screen
  const BOX = { mailSend: "Manage drafts and send emails", mailRead: "View your email messages and settings" };
  const noMail = (what) => { const e = new Error(tokenOk() ? `Google didn't allow this. Tap Reconnect in Settings > Connections and tick “${BOX[what || "mailSend"]}”.` : "Gmail needs a quick reconnect."); e.code = tokenOk() ? "forbidden" : "expired"; return e; };
  const hdrOf = (msg, n) => { const h = ((msg.payload || {}).headers || []).find(x => String(x.name).toLowerCase() === n); return h ? String(h.value || "") : ""; };
  const addrOf = (s) => { const a = addrList(s)[0]; return a ? a.email : String(s || "").trim().toLowerCase(); };

  function htmlText(h) {
    const s = String(h || "").replace(/<(style|script|head|title)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li|tr|h[1-6]|blockquote|table)\s*>/gi, "\n").replace(/<li\b[^>]*>/gi, "• ");

  }
  // The readable text of an email and the names of its attachments. A small picture inside the email's own layout
  // (a signature logo) isn't counted; a photo sent along is, even when the phone marks it "inline".
  // An iPhone puts photos between pieces of text in one multipart/mixed: those pieces are joined, in order.
  function walk(p, out, up) {
    if (!p) return out;
    const type = String(p.mimeType || "").toLowerCase(), disp = hdrIn(p.headers, "content-disposition"), body = p.body || {};
    const upType = up ? String(up.mimeType || "").toLowerCase() : "";

      const logo = /^image\//.test(type) && upType === "multipart/related" && !/^\s*attachment/i.test(disp) && (+body.size || 0) < 30000;

    probe().then(up => { if (up && document.visibilityState === "visible" && canLeave()) goToGoogle(true, typeof window.GIC_WHERE === "function" ? window.GIC_WHERE() : null); });

<script>
// Standalone runtime: signs people in with Firebase and gives the CRM the same small data API it used on claude.ai

  // ---------- sign-in screen ----------

    else if (state === "signin") h = `<h1>Sign in</h1>

        <label>Email<input type="email" id="gate-email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(lastEmail)}" required></label>
        <label>Password<span class="gate-pw"><input type="password" id="gate-pass" autocomplete="current-password" required><button type="button" class="gate-show" id="gate-show" aria-label="Show password">Show</button></span></label>

      <form id="gate-reset" class="gate-form" novalidate>

    gateBody.innerHTML = h;

  }

  if (!F || !CFG.firebase || !CFG.firebase.apiKey || !OWNER) { showGate("setup"); window.claude = { use: () => Promise.resolve(null) }; return; }

  // ---------- Firebase ----------
  const app = F.initializeApp(CFG.firebase);
  const auth = F.getAuth(app);
  const fs = F.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: CFG.memoryCache ? F.memoryLocalCache() : F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  if (CFG.emulator) { F.connectAuthEmulator(auth, CFG.emulator.auth, { disableWarnings: true }); F.connectFirestoreEmulator(fs, CFG.emulator.host, CFG.emulator.port); }

  };

  // answer for a while, so after a short wait the CRM carries on and the write syncs in the background.

  window.addEventListener("online", syncInfo); window.addEventListener("offline", syncInfo);
  function settle(p) {
    return new Promise((resolve, reject) => {
      let late = false;
      const timer = setTimeout(() => { late = true; pendingWrites++; syncInfo(); resolve(); }, CFG.writeWaitMs || 2500);
      p.then(() => { clearTimeout(timer); if (late) { pendingWrites--; syncInfo(); } else resolve(); },
        (e) => { clearTimeout(timer); const me = mapErr(e); if (late) { pendingWrites--; syncInfo(); fire("gic-write-failed", { code: me.code }); } else reject(me); });
    });
  }
  // the server turned this login away mid-session (removed from the team): cover the CRM again
  const denied = (e) => { if (e && e.code === "permission-denied" && me && !me.isOwner && gateState !== "notmember") showGate("notmember", "Your access to this CRM was turned off. Ask Elias if that's a mistake."); };
  const docSnap = (s) => ({ id: s.id, exists: s.exists(), data: () => (s.exists() ? toPlain(s.data()) : undefined) });
  // rulesv is only read, to check the database rules are up to date (it isn't backed up)
  const checkPath = (path) => { const segs = String(path).split("/").filter(Boolean); if (!COLLS.includes(segs[0]) && segs[0] !== "rulesv") throw Object.assign(new Error("Unknown collection " + segs[0]), { code: "invalid_argument" }); return segs; };
  function docApi(segs) {

      id: ref.id, path: ref.path,
      get: async () => { try { return docSnap(await F.getDoc(ref)); } catch (e) { throw mapErr(e); } },
      set: (data) => settle(F.setDoc(ref, toStore(data))),
      update: (data) => settle(F.setDoc(ref, toStore(data), { merge: true })),
      delete: () => settle(F.deleteDoc(ref)),
      onSnapshot: (cb, err) => F.onSnapshot(ref, s => cb(docSnap(s)), e => { denied(e); if (err) err(mapErr(e)); })

  }
  function collApi(name) {
    const ref = F.collection(fs, name);
    return {
      id: name, path: name,
      doc: (id) => docApi([name, id]),
      get: async () => { try { const s = await F.getDocs(ref); return { size: s.size, docs: s.docs.map(docSnap) }; } catch (e) { throw mapErr(e); } },
      onSnapshot: (cb, err) => F.onSnapshot(ref, snap => cb({ size: snap.size, docs: snap.docs.map(docSnap), fromCache: snap.metadata.fromCache }), e => { denied(e); if (err) err(mapErr(e)); })
    };

    collection: (name) => { checkPath(name); return collApi(String(name).replace(/^\/+|\/+$/g, "")); },
    doc: (path) => { const segs = checkPath(path); return docApi(segs); }

  const names = {};

    id: async () => me.uid,
    me: async () => ({ id: me.uid, name: me.name, email: me.email }),
    isOwner: () => !!(me && me.isOwner), canEdit: () => true, can: () => true,
    profiles: async (ids) => {
      const out = {};
      await Promise.all([...new Set(ids)].map(async id => {
        if (!(id in names)) { try { const s = await F.getDoc(F.doc(fs, "profiles", id)); names[id] = s.exists() ? (s.data().name || "") : ""; } catch (e) { names[id] = ""; } }
        out[id] = { id, name: names[id] };
      }));
      return out;
    }
  });

  // ---------- files: phones get the share sheet (save to Files, send in Gmail…), computers a normal download ----------
  const MIME = { csv: "text/csv", pdf: "application/pdf", png: "image/png", json: "application/json", txt: "text/plain" };
  const downloadsApi = Object.freeze({
    save: async ({ filename, data }) => {
      const ext = String(filename).split(".").pop().toLowerCase();
      const blob = data instanceof Blob ? data : new Blob([data], { type: (MIME[ext] || "application/octet-stream") + (ext === "csv" ? ";charset=utf-8" : "") });

      return Promise.resolve(null);
    }
  });

  // ---------- account tools for Settings > Account ----------
  const memberRef = (email) => F.doc(fs, "members", String(email).trim().toLowerCase());
  window.GIC = Object.freeze({
    owner: OWNER,
    me: () => me && Object.assign({}, me),
    pendingWrites: () => pendingWrites,
    // a document as the database has it now, not the copy on this device (fails with no connection)
    serverDoc: async (coll, id) => { const d = await F.getDocFromServer(F.doc(fs, coll, id)); return d.exists() ? toPlain(d.data()) : null; },
    signOut: () => F.signOut(auth),
    resetPassword: (email) => F.sendPasswordResetEmail(auth, email || (me && me.email)),
    members: async () => { const s = await F.getDocs(F.collection(fs, "members")); return s.docs.map(d => Object.assign({ email: d.id }, toPlain(d.data()))); },
    addMember: async ({ name, email, password }) => {
      email = String(email || "").trim().toLowerCase(); name = String(name || "").trim();

      if (email === OWNER) throw Object.assign(new Error("That's your own login."), { code: "is_owner" });
      if (String(password || "").length < 6) throw Object.assign(new Error("The password needs at least 6 characters."), { code: "weak" });

        catch (e) {
          const c = e.code || "";

          if (/weak-password/.test(c)) throw Object.assign(new Error("The password needs at least 6 characters."), { code: "weak" });
          if (/invalid-email/.test(c)) throw Object.assign(new Error("That doesn't look like an email address."), { code: "bad_email" });
          if (/network/.test(c)) throw Object.assign(new Error("No internet connection. Try again when you're online."), { code: "offline" });

        }

        try { await F.signOut(a2); } catch (e) {}

      } finally { try { await F.deleteApp(tmp); } catch (e) {} }
    },
    removeMember: async (email) => {
      if (!me || !me.isOwner) throw Object.assign(new Error("Only the owner can remove people."), { code: "owner_only" });
      await F.deleteDoc(memberRef(email));
    },
    exportAll: async () => {
      const out = { format: "get-it-clean-crm-backup", version: 1, exportedAt: new Date().toISOString(), collections: {} };
      for (const c of COLLS) { const s = await F.getDocs(F.collection(fs, c)); out.collections[c] = {}; s.docs.forEach(d => { out.collections[c][d.id] = toPlain(d.data()); }); }

    },
    // Loads a backup (or the file made from the old claude.ai CRM). Each record replaces the one with the same id.
    importAll: async (data, onProgress) => {

      if (!data || data.format !== "get-it-clean-crm-backup" || !data.collections) throw Object.assign(new Error("That file isn't a CRM backup."), { code: "bad_file" });

      const blastItems = items.filter(([c, id]) => c === "settings" && (/^blast/.test(id) || id === "gone-contacts"));
      blastItems.forEach(x => items.splice(items.indexOf(x), 1));

      // An older copy of a contact doesn't undo what happened since: marked do not contact or not interested, asked to be
      // taken off emails, or a bounce stays as it is now.

      let now = {}, gone = {};
      try {
        const s = await F.getDocsFromServer(F.collection(fs, "leads")); s.docs.forEach(d => { now[d.id] = d.data(); });
        const g = await F.getDocFromServer(F.doc(fs, "settings", "gone-contacts")); gone = (g.exists() && g.data().list) || {};
      } catch (e) { throw mapErr(e); }
      const FLAGS = ["dnc", "crashOut", "unsubscribed", "emailBounced", "noAutoEmail"], by = {};
      const addBy = (k, flags) => { k = String(k || "").trim().toLowerCase(); if (k && flags.length) (by[k] = by[k] || []).push({ flags }); };
      Object.keys(gone).forEach(id => { const g = gone[id] || {}; addBy(g.email, Array.isArray(g.flags) ? g.flags : []); });
      Object.keys(now).forEach(id => addBy(now[id].email, FLAGS.filter(f => now[id][f] === true)));

        // the same contact (by its ID) keeps everything; another contact on the same email passes on only its flags, and only
        // to one that isn't in the CRM now or is there with another email, so a customer's stage is never changed by someone
        // else on a shared inbox
        const was = [now[x[1]] ? Object.assign({ flags: FLAGS.filter(f => now[x[1]][f] === true), lost: now[x[1]].stage === "lost" }, { lostAt: now[x[1]].lostAt }) : null, gone[x[1]] || null]
          .concat(key && (!now[x[1]] || String(now[x[1]].email || "").trim().toLowerCase() !== key) ? by[key] || [] : []).filter(Boolean);

      });

      for (let i = 0; i < items.length; i += 400) {
        const b = F.writeBatch(fs);
        items.slice(i, i + 400).forEach(([c, id, d]) => b.set(F.doc(fs, c, id), toStore(d)));
        try { await b.commit(); } catch (e) { throw mapErr(e); }
        done = Math.min(items.length, i + 400); if (onProgress) onProgress(done, items.length);
      }
      // the file's deleted-contact list adds to the one here
      const oldGone = blastItems.find(([, id]) => id === "gone-contacts");
      if (oldGone && oldGone[2].list && typeof oldGone[2].list === "object") {
        const add = {}; Object.keys(oldGone[2].list).forEach(id => { if (!gone[id] && oldGone[2].list[id] && typeof oldGone[2].list[id] === "object") add[id] = oldGone[2].list[id]; });
        if (Object.keys(add).length) { try { await F.setDoc(F.doc(fs, "settings", "gone-contacts"), toStore({ kind: "gone", list: add }), { merge: true }); } catch (e) { throw mapErr(e); } }
      }
      // last, and only adding: an address the sender took off while this loaded stays as the sender saved it
      if (oldOut && oldOut[2].out && typeof oldOut[2].out === "object") {
        try {
          const s = await F.getDocFromServer(F.doc(fs, "settings", "blast-out")), cur = (s.exists() && s.data().out) || {}, add = {};
          Object.keys(oldOut[2].out).forEach(k => { const o = oldOut[2].out[k]; if (!cur[k] && o && typeof o === "object") add[k] = o; });
          if (Object.keys(add).length) await F.setDoc(F.doc(fs, "settings", "blast-out"), toStore({ kind: "blastout", out: add, updatedAt: new Date().toISOString() }), { merge: true });
        } catch (e) { throw mapErr(e); }

    }
  });

  showGate("loading");
  F.onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // signing out (or being removed) starts the page over, so nothing from the last login stays on screen
      if (wasIn) { location.reload(); return; }

const writing = {};
async function saveDoc(coll, id, data, merge) {

  const key = coll + "/" + id;
  if (coll === "leads" && data.stage && !data.stageSince) { const cur = leadById(id); if (!cur || cur.stage !== data.stage) data.stageSince = today(); }
  while (writing[key]) await writing[key];
  const p = (async () => {
    try { const ref = S.db.collection(coll).doc(id); if (merge) await ref.update(data); else await ref.set(data); }
    catch (e) { if (e && e.code === "quota_exceeded") toast("Your CRM storage is full. Delete old leads to add more."); else if (e && e.code === "invalid_argument") toast("That change couldn't be saved."); else toast("Couldn't save. Check your connection and try again."); throw e; }
  })();

}

// ---------- the sender (runs at script.google.com, not here) ----------
// The CRM hands this out as the script (Settings > Email blasts). It runs in the owner's Google account every 5 minutes:
// it looks for replies, bounces and "remove", then sends at most one blast email, during the hours each blast allows.
// Each contact is marked "sending" before the email goes and "sent" after, so a run that stops halfway can't send twice.
// It remembers every address it has emailed (blastmail/sent) and keeps watching them for "remove" and bounces long after
// their blast ends; an address that asked out or bounced (settings/blast-out) is never emailed again, by any blast.
function blastSender(PROJECT, VERSION, coreFn, BLOCKED_SHA) {
  const TZ = "America/New_York", NAME = "Elias | Get It Clean Tampa Bay", DAY_MAX = 80;

  const BLOCKED = /@lansbrooktampabay\.com$|^jgregor@parker\.com$/i;
  let meCache = "";
  const me = () => meCache || (meCache = String(Session.getEffectiveUser().getEmail() || "").toLowerCase());
  const addrOf = (s) => { const m = String(s || "").match(/<([^>]+)>/); return String(m ? m[1] : s || "").trim().toLowerCase(); };
  const keyOf = (e) => String(e || "").trim().toLowerCase();
  const oneAddr = (e) => /^[^\s@,;<>()"']+@[^\s@,;<>()"']+\.[a-z]{2,}$/i.test(String(e || "").trim());
  // where delivery failures come from (Gmail, most mail servers, and Microsoft's)
  const NDR = /^(mailer-daemon|postmaster|microsoftexchange[0-9a-f]*)@/;
  const threadOf = (m) => { try { return m.getThread().getId(); } catch (e) { return ""; } };
  // only the owner can write settings/blast*, so a blast or its progress counts only under its own name
  const isBlast = (d) => d.kind === "blast" && /^blast-/.test(d.id);
  const isRun = (d) => d.kind === "blastrun" && d.id === "blastrun-" + d.blastId;

  const blocked = (a) => keyOf(a).split(/[\s,;<>()"']+/).filter(Boolean).some(x => BLOCKED.test(x) || BLOCKED_SHA.indexOf(hex(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, x))) >= 0);
  const kylemont = (l) => /kylemont/i.test([l.name, l.company, l.email, l.area, l.address].join(" "));
  const dayText = (t) => Utilities.formatDate(t, TZ, "MMM d");
  const scriptId = () => { try { return ScriptApp.getScriptId(); } catch (e) { return ""; } };

  // ---- Firestore, as the owner (tried 3 times when it's busy) ----
  function call(method, path, body) {
    // the Firebase project pays for (and allows) the calls, not the script's own hidden Google project
    const opts = { method: method, contentType: "application/json", headers: { Authorization: "Bearer " + ScriptApp.getOAuthToken(), "X-Goog-User-Project": PROJECT }, muteHttpExceptions: true };
    if (body !== undefined) opts.payload = JSON.stringify(body);

    for (let i = 0; i < 3; i++) {
      if (i > 0) Utilities.sleep(1000 * Math.pow(2, i));
      try { r = UrlFetchApp.fetch((path.charAt(0) === ":" ? FS.slice(0, -1) : FS) + path, opts); } catch (err) { last = err; r = null; continue; }
      const code = r.getResponseCode();

      if (code === 429 || code >= 500) continue;

async function saveBankPct(el, typing) {

// one waiting save per lead, so setting another lead's date right after doesn't drop this one
const fuTimers = {};

}
